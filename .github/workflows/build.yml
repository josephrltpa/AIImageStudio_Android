name: Build APK

# Builds a debug APK entirely on GitHub's servers — no local Android SDK
# or Android Studio install required. Push this project to a GitHub repo
# and this runs automatically; download the APK from the "Actions" tab
# under the workflow run's "Artifacts" section.
# Uses gradle/actions/setup-gradle to provision Gradle itself, so no
# checked-in gradle-wrapper.jar binary is required.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIImageStudio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
